services:
  - type: web
    runtime: static
    name: portifolio
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    previews:
      generation: automatic
